name: SVP Kernel CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12.12"

    - name: Install locked application dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.lock
        python -m pip install --no-deps -e .

    - name: Import active FastAPI application
      run: |
        python -c "from app import app; assert any(route.path == '/ready' for route in app.routes); print('FastAPI application imported successfully.')"

    - name: Run active unit and governance regression suite
      run: |
        python -m unittest discover -s tests -p 'test*.py' -v

    - name: Smoke-test liveness without model inference
      run: |
        python - <<'PY'
        from fastapi.testclient import TestClient
        from app import app

        response = TestClient(app).get("/health")
        assert response.status_code == 200, response.text
        assert response.json() == {"status": "ok"}, response.text
        PY
